[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sparkd-provision"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.10", "cryptography>=43", "dbus-fast>=2.21", "qrcode[pil]>=8.0"]

[project.scripts]
sparkd-provision = "sparkd_provision.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]
probe = ["bleak>=3,<4"]
# GPIO wiring is board-specific, so keep its native binding out of simulator and
# browser-developer installs.  Hardware images enable this extra.
hardware = ["gpiod>=2.2"]

[tool.setuptools.package-data]
sparkd_provision = ["portal/static/index.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
